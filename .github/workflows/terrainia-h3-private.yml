name: TerrainIA H3 FL2VA private comparison
on:
  push:
    branches: [diagnostics/h3-modal-inventory-20261113]
permissions:
  contents: read
jobs:
  render-comparison:
    if: github.event.head_commit.message == 'Run one authorized private TerrainIA H3 FL2VA comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q modal==1.6.2 cryptography Pillow imageio-ffmpeg==0.6.0
      - name: Verify graph contract without GPU
        run: |
          python -m py_compile pilots/terrainia-h3-private/run.py pilots/terrainia-h3-private/worker.py
          PYTHONPATH=pilots/terrainia-h3-private python - <<'PY'
          from worker import build_graph
          g = build_graph(dict(width=576,height=1024,frames=107,steps=20,seed=128022,prompt="check"),"one.png","test","two.png")
          assert g["104"]["inputs"]["first_frame"] == ["1",0]
          assert g["104"]["inputs"]["last_frame"] == ["2",0]
          assert g["9"]["inputs"]["steps"] == 20
          PY
      - name: One H3 render using the cached MAISON weights
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u pilots/terrainia-h3-private/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: terrainia-h3-encrypted-result
          path: build/h3-private/result.encrypted
          if-no-files-found: error
          retention-days: 5
      - name: Remove the one-shot decryption key after a verified upload
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import modal
          modal.Dict.objects.delete("terrainia-h3-pilot-20261113-transport", environment_name="main", allow_missing=True)
          PY
