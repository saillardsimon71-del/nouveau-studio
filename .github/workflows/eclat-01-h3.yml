name: ECLAT 01 | Real French talking beauty ad on Modal H3

on:
  push:
    branches: [production/eclat-01-h3-speaking-20261025]
    paths:
      - ".github/workflows/eclat-01-h3.yml"
      - "scripts/production/eclat_01_h3.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: eclat-01-real-french-ad-once
  # Preflight run 40195355642 succeeded; launch one approved two-shot H3 production
  cancel-in-progress: false

jobs:
  production:
    if: ${{ github.event.head_commit.message == 'CHECK_ECLAT_01_20261025' || github.event.head_commit.message == 'RUN_ECLAT_01_H3_20261025' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools, stock image utilities, Modal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "modal>=1.0,<2"
          ffprobe -version | head -1
      - name: Compile campaign script without GPU
        run: python -m py_compile scripts/production/eclat_01_h3.py
      - name: Prepare real photo, two exact first-frames and licensed music
        run: python scripts/production/eclat_01_h3.py preflight
      - name: Verify available Modal H3 batch GPU function (no inference)
        if: ${{ github.event.head_commit.message == 'RUN_ECLAT_01_H3_20261025' }}
        run: |
          set -euo pipefail
          modal token info >/dev/null 2>&1
          python - <<'PY'
          import modal
          modal.Function.from_name("pvs-minimax-h3","render_batch",environment_name="main").hydrate()
          print("H3 batch GPU ready")
          PY
      - name: Generate TWO full-quality authentic-photo H3 scenes (one Modal L40S batch)
        if: ${{ github.event.head_commit.message == 'RUN_ECLAT_01_H3_20261025' }}
        run: python scripts/production/eclat_01_h3.py render
      - name: Edit and master genuine French commercial with score + web version
        if: ${{ github.event.head_commit.message == 'RUN_ECLAT_01_H3_20261025' }}
        run: python scripts/production/eclat_01_h3.py assemble
      - name: Inspect the final MP4 metadata
        if: ${{ github.event.head_commit.message == 'RUN_ECLAT_01_H3_20261025' }}
        run: |
          set -euo pipefail
          test -s artifacts/eclat01/exports/ECLAT-01-SITEQUIVEND-FRENCH-AD-H3.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height -of json artifacts/eclat01/exports/ECLAT-01-SITEQUIVEND-FRENCH-AD-H3.mp4
          cat artifacts/eclat01/exports/delivery.json
      - name: Upload all scene footage, final ad, credits, poster and metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ECLAT-01-FRENCH-COMMERCIAL-H3
          path: |
            artifacts/eclat01/exports/
            artifacts/eclat01/clips/
            artifacts/eclat01/provenance.json
            artifacts/eclat01/render-report.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Production report
        if: always()
        run: |
          echo "## ECLAT / 01 | SiteQuiVend portfolio" >> "$GITHUB_STEP_SUMMARY"
          echo "Authentic Pexels first-frames, 20-step MiniMax H3, Modal L40S; two fresh scenes with native French speech, no prior artifact dependency." >> "$GITHUB_STEP_SUMMARY"
          echo "Human QC of French voice, lips, hands, packaging and music remains mandatory." >> "$GITHUB_STEP_SUMMARY"
