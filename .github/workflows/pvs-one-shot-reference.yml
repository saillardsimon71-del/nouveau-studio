name: PVS - One-shot reference image (5s)
# One-time real image-to-video benchmark. Triggered only when this workflow is first committed to main.
# Remove this file after the run is queued: no recurring GPU usage.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pvs-one-shot-reference.yml
permissions:
  contents: read
concurrency:
  group: pvs-one-shot-reference
  cancel-in-progress: false
jobs:
  reference_render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PVS_MODAL_APP: pvs-ltx
      PVS_MODAL_LTX_VOLUME: studio-ltx25-models
      PVS_MODAL_GPU: L40S
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Modal client
        run: pip install --upgrade "modal>=1.0,<2"
      - name: Check credentials and reference (no sensitive output)
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MODAL_TOKEN_ID:-}" =~ ^ak-[A-Za-z0-9_-]+$ ]] || { echo "::error::Invalid MODAL_TOKEN_ID"; exit 1; }
          [[ "${MODAL_TOKEN_SECRET:-}" =~ ^as-[A-Za-z0-9_-]+$ ]] || { echo "::error::Invalid MODAL_TOKEN_SECRET"; exit 1; }
          test -s benchmark_assets/character_reference.png
          modal token info >/dev/null 2>&1 || { echo "::error::Modal authentication failed"; exit 1; }
          modal volume list | grep -q studio-ltx25-models || { echo "::error::Expected LTX model volume not found"; exit 1; }
          echo "Credentials accepted; expected model volume available. GPU not started yet."
      - name: Render 5 s image-to-video on Modal L40S
        shell: bash
        run: |
          set -euo pipefail
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "Cinematic photo-realistic moving portrait of precisely the same French male presenter as in the reference image: short dark hair, neat short beard, charcoal knit sweater, natural skin pores, same facial identity, same wardrobe. Dark premium tech studio, cool blue key light, subtle warm rim light, gentle breathing and slight natural head movement, slow stable dolly in, clean realistic image, absolutely no written words, no cuts or transformations." \
            --duration 5 \
            --aspect 9:16 \
            --seed 42 \
            --audio-mode native \
            --image-png benchmark_assets/character_reference.png \
            --out artifacts/pvs_reference_5s.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvs-reference-5s
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Result and measured GPU estimate
        if: always()
        shell: bash
        run: |
          if test -f artifacts/pvs_reference_5s.json; then
            python - <<'PY'
          import json
          with open("artifacts/pvs_reference_5s.json",encoding="utf-8") as f:
              m=json.load(f)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],"a",encoding="utf-8") as f:
              f.write("### Reference image-to-video (real LTX-2.5)\n")
              for k in ["gpu","width","height","fps","duration_sec","generation_seconds","cost_estimate_usd","video_codec","audio_codec"]:
                  f.write(f"- {k}: {m.get(k, 'N/A')}\n")
              f.write("\nDownload artifact: pvs-reference-5s\n")
          PY
          else
            echo "No MP4 metadata. Check Render logs." >> "$GITHUB_STEP_SUMMARY"
          fi
