name: Portfolio | NOIR 01 18s (Pexels + LTX)
# Push only runs 0-GPU preflight, except a SINGLE exact opt-in commit message for this requested production.
on:
  push:
    branches: [production/portfolio-noir-01-20261024]
    paths: ['.github/workflows/portfolio-noir-01.yml', 'scripts/production/portfolio_noir_01.py']
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        description: 'Check assets for free or render the LTX film'
        options: [preflight, render]
        default: preflight
      confirm_spend:
        type: choice
        description: 'Explicitly authorize Modal GPU spend'
        options: ['non', 'oui']
        default: 'non'
permissions:
  contents: read
concurrency:
  # Separate a one-time approved render from an old stuck no-GPU preflight queue.
  group: portfolio-noir-01-20261024
  cancel-in-progress: false
jobs:
  showreel:
    # All ordinary pushes remain no-GPU; only the exact approved, one-use commit triggers production.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: '1'
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_WORKSPACE_EXPECTED: kulejean567
      PVS_MODAL_APP: pvs-ltx
      PVS_MODAL_LTX_VOLUME: studio-ltx25-models
      PVS_MODAL_GPU: L40S
      PVS_MODAL_RENDER_TIMEOUT: '480'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preflight and editing tools
        run: |
          set -eu
          python -m pip install --disable-pip-version-check --timeout 40 --retries 1 'Pillow>=11,<13'
          # GitHub's standard Ubuntu image normally already has ffmpeg and DejaVu.
          # Avoid an unconditional apt-get update, which stalled the earlier preflight.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Verify real Pexels photos and licensed music before any GPU
        run: |
          set -eu
          python scripts/production/portfolio_noir_01.py prepare --out artifacts
          test -s artifacts/source-provenance.json
          for name in revelation matiere packshot; do test -s "artifacts/references/$name-reference.png"; done
          echo '### Pexels sources verified — zero GPU' >> "$GITHUB_STEP_SUMMARY"
      - name: Download photos and provenance for visual review
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-01-Pexels-references
          path: |
            artifacts/references/
            artifacts/source-provenance.json
          retention-days: 14
      - name: Require explicit spend consent and Modal credentials
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        env:
          # This exact push commit is authorized by the user in chat; any other push is skipped.
          SPEND_APPROVAL: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024' && 'oui' || inputs.confirm_spend }}
        run: |
          set -eu
          test "$SPEND_APPROVAL" = 'oui' || { echo "::error::No GPU authorization"; exit 1; }
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || { echo "::error::No Modal secrets"; exit 1; }
      - name: Install Modal only for paid manual render
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        run: python -m pip install 'modal>=1.0,<2'
      - name: LTX shot 1 - revelation
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        env:
          PROMPT: >-
            Premium experimental niche-fragrance campaign, photorealistic continuous shot. Preserve exactly the unbranded sculptural glass perfume bottle lying diagonally on a real wet dark surface from the reference, cap and glass outlines unchanged. Very slow cinematic optical push-in with minuscule lateral parallax. Soft warm copper highlights gently move over the droplets and glass. Background remains charcoal-black with subtle natural moisture sparkle. Do not stand up, turn, lift or reshape the bottle. No added objects, no new labels, no cuts, no typography or logo.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 916011 \
            --image-png artifacts/references/revelation-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/revelation-ltx.mp4

      - name: LTX shot 2 - matiere
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        env:
          PROMPT: >-
            Hyperreal perfume advertising macro from the exact reference crop of the SAME lying glass bottle. Preserve the water droplets, curved bottle body, black cap and damp dark ground. Extremely subtle focus pull between small water droplets and the glass edge, gentle optical camera drift under a few centimeters, realistic copper specular caustics. Rigid stable glass geometry, no extra objects, no standing bottle, no melting, no new lettering, no cuts. Continuous premium commercial photography.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 916012 \
            --image-png artifacts/references/matiere-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/matiere-ltx.mp4

      - name: LTX shot 3 - packshot
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        env:
          PROMPT: >-
            Photorealistic luxury niche fragrance final packshot. Preserve exactly the same unbranded perfume bottle lying on a wet charcoal surface, all contours, droplets and cap unchanged from the reference. Slow calm dolly-out with realistic slight shifts in reflections of existing water droplets; distant background darkens gracefully, no invented pool, no product relocation, no levitation. Elegant controlled low-key studio photography with soft amber edge highlights, no transformations, no text, no labels, no cuts.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 916013 \
            --image-png artifacts/references/packshot-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/packshot-ltx.mp4

      - name: Preserve all real clips even if assembly fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-01-LTX-source-shots
          path: artifacts/clips/
          if-no-files-found: ignore
          retention-days: 14
      - name: Assemble hard cuts, licensed music and 48fps delivery
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        run: |
          set -euo pipefail
          python scripts/production/portfolio_noir_01.py assemble --out artifacts
          test -s artifacts/exports/NOIR-01-Spot-18s-LTX.mp4
          echo '### Delivered: 18s / 1080x1920 / 48fps interpolated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Visual approval is still required before publication. Source LTX is native 24fps.' >> "$GITHUB_STEP_SUMMARY"
          echo "Music: 'Ascension' by Scott Buckley, CC BY 4.0 — attribution required." >> "$GITHUB_STEP_SUMMARY"
      - name: Download MP4, cover and attribution
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_PORTFOLIO_NOIR_01_ONCE_20261024')
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-01-18s-LTX
          path: artifacts/exports/
          if-no-files-found: error
          retention-days: 30
