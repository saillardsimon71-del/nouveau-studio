name: English Talking-Head — cloned voice sample and avatar

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "CPU prepare/smoke test, create a short voice sample, or render after approval"
        type: choice
        options: [cpu_check, voice_sample, render]
        default: voice_sample
      voice_approved:
        description: "For render only: I listened to the sample artifact and approve this voice"
        type: choice
        options: [no, yes]
        default: no
      confirm_gpu_spend:
        description: "For render only: authorize the full Modal GPU render"
        type: choice
        options: [no, yes]
        default: no

permissions:
  contents: read
concurrency:
  group: english-talking-head-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      STAGE: ${{ inputs.stage }}
      VOICE_APPROVED: ${{ inputs.voice_approved }}
      CONFIRM_GPU_SPEND: ${{ inputs.confirm_gpu_spend }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate authorizations and production inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGE" == voice_sample || "$STAGE" == render ]]
          [[ -s content/productions/english-talking-head-20261027/assets/portrait.jpg ]]
          [[ -s content/productions/english-talking-head-20261027/assets/voice.mp3 ]]
          if [[ "$STAGE" == render ]]; then
            [[ "$VOICE_APPROVED" == yes ]] || { echo "::error::Listen to and approve voice_sample artifact first"; exit 1; }
            [[ "$CONFIRM_GPU_SPEND" == yes ]] || { echo "::error::render requires explicit GPU-spend approval"; exit 1; }
          fi
          [[ "${MODAL_TOKEN_ID:-}" =~ ^ak-[A-Za-z0-9_-]+$ ]] || { echo "::error::Modal token id missing or malformed"; exit 1; }
          [[ "${MODAL_TOKEN_SECRET:-}" =~ ^as-[A-Za-z0-9_-]+$ ]] || { echo "::error::Modal token secret missing or malformed"; exit 1; }
      - name: Install Modal client and image tooling
        run: |
          pip install modal==1.6.1 imageio-ffmpeg==0.6.0 pillow
          mkdir -p "$RUNNER_TEMP/pvs-bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/pvs-bin/ffmpeg"
          ln -sf "$RUNNER_TEMP/pvs-bin/ffmpeg" "$RUNNER_TEMP/pvs-bin/ffprobe"
          echo "$RUNNER_TEMP/pvs-bin" >> "$GITHUB_PATH"
      - name: Verify original media provenance and prepare image without changing appearance
        run: |
          set -euo pipefail
          test "$(git hash-object content/productions/english-talking-head-20261027/assets/portrait.jpg)" = 7a027e76012449546f3c8f41348512fb17af10aa
          test "$(git hash-object content/productions/english-talking-head-20261027/assets/voice.mp3)" = 2159c910f30db2afe8b640d83b08d7c39cacb823
          mkdir -p artifacts
          python - <<'PY'
          from PIL import Image
          image = Image.open("content/productions/english-talking-head-20261027/assets/portrait.jpg").convert("RGB")
          image.save("artifacts/portrait.png", format="PNG")
          print(f"Original portrait dimensions: {image.size}")
          PY
      - name: CPU-only Chatterbox V3 model-load and inference smoke test
        if: ${{ inputs.stage == 'cpu_check' || inputs.stage == 'voice_sample' }}
        run: modal run -m deploy.modal_english_voice --mode cpu-check
      - name: Generate new-text voice sample with Chatterbox V3 on Modal
        if: ${{ inputs.stage == 'voice_sample' }}
        env:
          VOICE_SAMPLE_TEXT: "Hello, and thank you for taking the time to meet me. I value thoughtful work and clear communication."
        run: |
          set -euo pipefail
          modal run -m deploy.modal_english_voice --reference-mp3 content/productions/english-talking-head-20261027/assets/voice.mp3 --text "$VOICE_SAMPLE_TEXT" --out artifacts/voice_sample.wav --artifact-name voice_sample.wav
          python - <<'PY'
          import json, wave
          from pathlib import Path
          path = Path("artifacts/voice_sample.wav")
          with wave.open(str(path), "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()
              print(f"Voice sample duration: {duration:.2f}s")
              if not 5 <= duration <= 8:
                  raise SystemExit("Voice sample must be 5–8 seconds; revise sample text before any avatar render")
          print(Path("artifacts/voice_sample.json").read_text())
          PY
      - name: Generate complete 45–60 second English narration with same voice reference
        if: ${{ inputs.stage == 'render' }}
        env:
          FULL_SCRIPT: >-
            Hello, and thank you for taking the time to meet me. I’m a thoughtful professional who enjoys turning ideas into clear, practical outcomes. I believe good work starts with listening, asking the right questions, and understanding what matters most. From there, I bring curiosity, care, and steady collaboration to each step, from the first conversation through delivery. I value clear communication, attention to detail, and learning from feedback. I’m especially interested in work where creativity and technology can make everyday experiences more useful and engaging. I approach new challenges with an open mind and a commitment to doing the work well. I’d welcome the opportunity to learn about your goals, share how I could contribute, and explore what we might create together. Thank you for listening.
        run: |
          set -euo pipefail
          modal run -m deploy.modal_english_voice --reference-mp3 content/productions/english-talking-head-20261027/assets/voice.mp3 --text "$FULL_SCRIPT" --out artifacts/voice_full.wav --artifact-name voice_full.wav
          python - <<'PY'
          import wave
          with wave.open("artifacts/voice_full.wav", "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()
              print(f"Full narration duration: {duration:.2f}s")
              if not 45 <= duration <= 60:
                  raise SystemExit("Narration is outside 45–60 seconds; do not proceed to video GPU")
          PY
      - name: Generate talking-head video on isolated LongCat Modal A100
        if: ${{ inputs.stage == 'render' }}
        run: |
          set -euo pipefail
          modal run -m deploy.modal_avatar_models --mode doctor
          modal run -m deploy.modal_avatar_worker \
            --image-png artifacts/portrait.png \
            --audio-wav artifacts/voice_full.wav \
            --out artifacts/english_talking_head.mp4 \
            --prompt "Photorealistic self-recorded professional talking head, preserving the exact person, natural skin texture, hair and light-blue shirt from the reference photograph, neutral grey background, soft even lighting, direct eye contact, calm confident delivery, restrained expression, minimal head movement, natural blinking and breathing. No cuts, no camera movement, no text, no logos, no beautification."
      - name: Automated MP4 and voice-track QC
        if: ${{ inputs.stage == 'render' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, wave
          from pathlib import Path
          video = Path("artifacts/english_talking_head.mp4")
          if not video.is_file() or video.stat().st_size < 100_000:
              raise SystemExit("No substantial MP4 generated")
          info = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(video)
          ], text=True))
          streams = info["streams"]
          v = next((s for s in streams if s["codec_type"] == "video"), None)
          a = next((s for s in streams if s["codec_type"] == "audio"), None)
          duration = float(info["format"]["duration"])
          with wave.open("artifacts/voice_full.wav", "rb") as wav:
              voice_duration = wav.getnframes() / wav.getframerate()
          report = {
              "duration_seconds": duration,
              "voice_wav_duration_seconds": voice_duration,
              "video_codec": v.get("codec_name") if v else None,
              "width": int(v["width"]) if v else None,
              "height": int(v["height"]) if v else None,
              "frame_rate": v.get("r_frame_rate") if v else None,
              "audio_codec": a.get("codec_name") if a else None,
              "audio_present": a is not None,
              "file_bytes": video.stat().st_size,
              "status": "automated_container_checks_only_visual_identity_lipsync_need_human_review",
          }
          Path("artifacts/qc_report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if not (45 <= duration <= 60 and v and v.get("codec_name") == "h264" and a and a.get("codec_name") == "aac"):
              raise SystemExit("MP4 failed duration / H.264 / AAC QC")
          if abs(duration - voice_duration) > 1.0:
              raise SystemExit("Audio/video duration mismatch exceeds 1 second")
          PY
      - name: Summary — no unreviewed voice-quality claims
        if: always()
        run: |
          {
            echo "## English talking-head production"
            echo "- Stage: $STAGE"
            echo "- Voice model: Chatterbox Multilingual V3, English, supplied MP3 used only as speaker reference"
            echo "- Voice similarity: NOT automatically verified; listen to voice_sample.wav and compare with the original reference"
            if [[ "$STAGE" == voice_sample ]]; then
              echo "- Private sample: Modal volume pvs-english-talking-head-private / english-talking-head-20261027/voice_sample.wav"
              echo "- Retrieve with: modal volume get pvs-english-talking-head-private english-talking-head-20261027/voice_sample.wav ./voice_sample.wav"
              echo "- Next step: listen to the sample and compare with the reference; dispatch render only if acceptable"
            fi
            if [[ -s artifacts/english_talking_head.mp4 ]]; then
              echo "- MP4: generated; visual identity, lip-sync and temporal quality still require human review"
            else
              echo "- MP4: not generated in this run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
