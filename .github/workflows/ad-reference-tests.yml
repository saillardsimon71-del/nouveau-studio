name: Advertising reference CPU tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "studio/ad-references/**"
      - "scripts/ad_references.py"
      - ".github/workflows/ad-reference-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PVS_MODAL_ENABLED: "0"
      PVS_LLM_API_KEY: ""
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU media and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r backend/requirements.txt "librosa==0.11.0" "modal>=1,<2"
      - name: Run full suite without model weights or inference
        run: python -m pytest -o addopts='' -q
      - name: Generate deterministic Director demonstrations
        run: python scripts/ad_references.py demos --out artifacts/ad-reference-demos
