name: PVS One-Time Avatar Model Prep (CPU)
on:
  push:
    branches: [main]
    paths: [.github/workflows/pvs-avatar-model-prep-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m py_compile deploy/modal_avatar_worker.py
      - run: pip install "modal>=1.0,<2"
      - name: Verify the right workspace without exposing tokens
        shell: bash
        run: |
          set -euo pipefail
          [[ "${MODAL_TOKEN_ID:-}" =~ ^ak-[A-Za-z0-9_-]+$ ]] || exit 1
          [[ "${MODAL_TOKEN_SECRET:-}" =~ ^as-[A-Za-z0-9_-]+$ ]] || exit 1
          modal token info >/dev/null 2>&1 || exit 1
          modal volume list | grep -q studio-ltx25-models || { echo "Expected workspace volume missing"; exit 1; }
          echo "Workspace checked; CPU model download begins."
      - name: Download LongCat Avatar v1.5 weights into NEW pvs-longcat-models volume
        run: modal run deploy/modal_avatar_worker.py --mode prepare
      - name: Mark result in summary
        if: always()
        run: |
          echo "### LongCat Avatar model staging" >> "$GITHUB_STEP_SUMMARY"
          echo "CPU only: no GPU render requested. Writes only to pvs-longcat-models." >> "$GITHUB_STEP_SUMMARY"
