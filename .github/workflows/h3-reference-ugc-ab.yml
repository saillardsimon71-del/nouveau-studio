name: "H3 | A-B speaking ad: reference-free vs measured-reference Director"

on:
  push:
    branches: [production/h3-ad-reference-ab-20261025]
    paths:
      - ".github/workflows/h3-reference-ugc-ab.yml"
      - "scripts/production/h3_reference_ugc_ab.py"

permissions:
  contents: read

concurrency:
  group: h3-ugc-reference-AB-once
  # No-GPU preflight before deliberate paired H3 production
  cancel-in-progress: false

jobs:
  controlled_AB:
    if: ${{ github.event.head_commit.message == 'CHECK_H3_REFERENCE_UGC_AB_20261025' || github.event.head_commit.message == 'RUN_H3_REFERENCE_UGC_AB_20261025' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PVS_LLM_API_KEY: ""
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Studio backend and Pexels media dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r backend/requirements.txt "Pillow>=11,<13" "modal>=1,<2"
      - name: Verify syntax, measured data and fully matched Director A/B (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/production/h3_reference_ugc_ab.py
          python scripts/production/h3_reference_ugc_ab.py preflight
      - name: Validate existing self-hosted H3 Modal worker (no GPU render)
        if: ${{ github.event.head_commit.message == 'RUN_H3_REFERENCE_UGC_AB_20261025' }}
        run: |
          set -euo pipefail
          modal token info >/dev/null 2>&1
          python - <<'PY'
          import modal
          modal.Function.from_name("pvs-minimax-h3","render_batch",environment_name="main").hydrate()
          print("Existing Modal H3 batch worker reachable")
          PY
      - name: ONE TWO-SHOT L40S native H3 batch — identical photo/script/seed/steps
        if: ${{ github.event.head_commit.message == 'RUN_H3_REFERENCE_UGC_AB_20261025' }}
        run: python scripts/production/h3_reference_ugc_ab.py render
      - name: Audio-video and French ASR evaluation (CPU, no new GPU)
        if: ${{ github.event.head_commit.message == 'RUN_H3_REFERENCE_UGC_AB_20261025' }}
        run: |
          python -m pip install -r backend/requirements-ad-analysis.txt
          python scripts/production/h3_reference_ugc_ab.py evaluate
      - name: Upload both true MP4 videos, precise prompts, frames, measured audio and honest evaluation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H3-UGC-REFERENCE-AB-REAL-VIDEO
          path: artifacts/h3-voice-AB/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Summary
        if: always()
        run: |
          echo "## H3 speaking ads, A versus B" >> "$GITHUB_STEP_SUMMARY"
          echo "A and B share same real stock image, French speech, timing, seed, 20 inference steps." >> "$GITHUB_STEP_SUMMARY"
          echo "Only Director reference performance guidance differs." >> "$GITHUB_STEP_SUMMARY"
          echo "Lip sync, emotion and naturalness require manual viewing; never infer improvement from word rate alone." >> "$GITHUB_STEP_SUMMARY"
