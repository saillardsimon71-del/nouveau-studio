name: SiteQuiVend | HERO 27s six universes
# Push only runs 0-GPU preflight, except a SINGLE exact opt-in commit message for this requested production.
on:
  push:
    branches: [feat/sitequivend-hero-showreel-20261023]
    paths: ['.github/workflows/sitequivend-showreel-pexels.yml', 'scripts/production/sitequivend_showreel_pexels.py']
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        description: 'Check assets for free or render the LTX film'
        options: [preflight, render]
        default: preflight
      confirm_spend:
        type: choice
        description: 'Explicitly authorize Modal GPU spend'
        options: ['non', 'oui']
        default: 'non'
permissions:
  contents: read
concurrency:
  # Separate a one-time approved render from an old stuck no-GPU preflight queue.
  group: sqv-hero-20261023
  cancel-in-progress: false
jobs:
  showreel:
    # All ordinary pushes remain no-GPU; only the exact approved, one-use commit triggers production.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_WORKSPACE_EXPECTED: kulejean567
      PVS_MODAL_APP: pvs-ltx
      PVS_MODAL_LTX_VOLUME: studio-ltx25-models
      PVS_MODAL_GPU: L40S
      PVS_MODAL_RENDER_TIMEOUT: '480'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preflight and editing tools
        run: |
          set -eu
          python -m pip install --disable-pip-version-check --timeout 40 --retries 1 'Pillow>=11,<13'
          # GitHub's standard Ubuntu image normally already has ffmpeg and DejaVu.
          # Avoid an unconditional apt-get update, which stalled the earlier preflight.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Verify real Pexels photos and licensed music before any GPU
        run: |
          set -eu
          python scripts/production/sitequivend_showreel_pexels.py prepare --out artifacts
          test -s artifacts/source-provenance.json
          for name in beauty food coffee fashion automotive technology; do test -s "artifacts/references/$name-reference.png"; done
          echo '### Pexels sources verified — zero GPU' >> "$GITHUB_STEP_SUMMARY"
      - name: Download photos and provenance for visual review
        uses: actions/upload-artifact@v4
        with:
          name: SiteQuiVend-Pexels-references
          path: |
            artifacts/references/
            artifacts/source-provenance.json
          retention-days: 14
      - name: Require explicit spend consent and Modal credentials
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          # This exact push commit is authorized by the user in chat; any other push is skipped.
          SPEND_APPROVAL: ${{ github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023' && 'oui' || inputs.confirm_spend }}
        run: |
          set -eu
          test "$SPEND_APPROVAL" = 'oui' || { echo "::error::No GPU authorization"; exit 1; }
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" || { echo "::error::No Modal secrets"; exit 1; }
      - name: Install Modal only for paid manual render
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        run: python -m pip install 'modal>=1.0,<2'
      - name: LTX shot 1 - beauty
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          PROMPT: >-
            A luxury skincare commercial. A single amber serum bottle on a sunlit counter. The glass dropper is lifted gently and a real viscous serum droplet grows and falls back into the open bottle. Cinematic macro lens and warm caustic light. Preserve product geometry and label. One continuous shot, no cuts, no text, no camera zoom simulation.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 812510 \
            --image-png artifacts/references/beauty-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/beauty-ltx.mp4

      - name: LTX shot 2 - food
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          PROMPT: >-
            Premium chocolate commercial. Rich glossy chocolate flows in a thin natural ribbon onto a stacked brownie, catching highlights. A deliberate slow lateral camera tracking move reveals appetizing texture. Preserve the exact brownie and scene geometry. One continuous physically believable shot, no new props, no text.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 812511 \
            --image-png artifacts/references/food-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/food-ltx.mp4

      - name: LTX shot 3 - coffee
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          PROMPT: >-
            Luxury espresso campaign. Real golden espresso continuously flows from a stationary portafilter into a ceramic cup; crema swirls naturally and steam rises subtly. Cinematic low-angle lateral dolly and beautiful reflections. Preserve equipment and cup. No extra streams, no text, no cuts.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 812512 \
            --image-png artifacts/references/coffee-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/coffee-ltx.mp4

      - name: LTX shot 4 - fashion
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          PROMPT: >-
            High-end fashion editorial. A subtle breeze moves hanging garments naturally on a clothes rack, fabric folds and textures shift with realistic weight. Smooth sideways camera tracking with authentic parallax and rich controlled contrast. Preserve every garment, no new objects, no deformations, no text.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 812513 \
            --image-png artifacts/references/fashion-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/fashion-ltx.mp4

      - name: LTX shot 5 - automotive
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          PROMPT: >-
            Premium automotive commercial. The exact car in the reference begins rolling forward on the road, tires rotate correctly and realistic sunlight reflections move across the bodywork. Dynamic low-angle tracking shot moving alongside the car, grounded wheel contact and believable road motion. Keep exact car color and shape. No brand logo invention, no cuts, no text.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 812514 \
            --image-png artifacts/references/automotive-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/automotive-ltx.mp4

      - name: LTX shot 6 - technology
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        env:
          PROMPT: >-
            Premium consumer technology product commercial. The exact smartphone remains physically consistent as a human hand enters frame and gently picks it up, turning the device a few degrees; realistic glass reflections and subtle screen illumination. Smooth deliberate cinematic camera slide, no impossible geometry, no warped fingers, no text, no cuts.
        run: |
          set -euo pipefail
          mkdir -p artifacts/clips
          modal run deploy/modal_ltx_worker.py --mode render \
            --prompt "$PROMPT" --duration 5 --aspect '9:16' --seed 812515 \
            --image-png artifacts/references/technology-reference.png \
            --image-strength 0.85 --audio-mode silent --out artifacts/clips/technology-ltx.mp4
      - name: Preserve all real clips even if assembly fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SiteQuiVend-LTX-source-shots
          path: artifacts/clips/
          if-no-files-found: ignore
          retention-days: 14
      - name: Assemble hard cuts, licensed music and 48fps delivery
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        run: |
          set -euo pipefail
          python scripts/production/sitequivend_showreel_pexels.py assemble --out artifacts
          test -s artifacts/exports/SiteQuiVend-Hero-Showreel-LTX-27s.mp4
          echo '### Delivered: 27s / 1080x1920 / 48fps interpolated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Visual approval is still required before publication. Source LTX is native 24fps.' >> "$GITHUB_STEP_SUMMARY"
          echo "Music: 'Ascension' by Scott Buckley, CC BY 4.0 — attribution required." >> "$GITHUB_STEP_SUMMARY"
      - name: Download MP4, cover and attribution
        if: (github.event_name == 'workflow_dispatch' && inputs.stage == 'render' && inputs.confirm_spend == 'oui') || (github.event_name == 'push' && github.event.head_commit.message == 'RUN_SITEQUIVEND_HERO_ONCE_20261023')
        uses: actions/upload-artifact@v4
        with:
          name: SiteQuiVend-Hero-Showreel-27s-LTX
          path: artifacts/exports/
          if-no-files-found: error
          retention-days: 30
